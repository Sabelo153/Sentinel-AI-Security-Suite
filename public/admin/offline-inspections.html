<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Sentinel offline inspections</title><link rel="stylesheet" href="admin.css?v=6"><link rel="stylesheet" href="workspace.css?v=1"><link rel="manifest" href="inspection-offline.webmanifest"></head>
<body><main class="section" style="max-width:900px;margin:24px auto;padding:24px"><h1>Offline inspections</h1><p><a href="index.html#inspection-forms">Company workspace</a></p><p id="status" role="status">Loading…</p><p>Prepare forms while connected. A saved inspection stays encrypted on this browser until the signed-in account receives a server receipt. Keep this tab available before leaving coverage.</p><form id="unlock" class="form-stack"><label>Offline vault passphrase (12 characters minimum)<input id="passphrase" type="password" minlength="12" autocomplete="off" required></label><button class="primary">Unlock or create my vault</button></form><section id="workspace" hidden><p id="identity"></p><p id="storage"></p><div><button id="lock" type="button">Lock vault</button> <button id="sync" type="button">Sync now</button> <button id="refresh" type="button">Refresh queue</button></div><form id="cache" class="form-stack"><label>Site ID<input id="site" type="number" min="1" required></label><button>Download current site forms for offline use</button></form><section id="forms"></section><h2>Pending inspections</h2><section id="queue"></section><h2>Server receipts</h2><section id="receipts"></section></section></main><script src="offline-inspection-vault.js"></script><script src="offline-inspections.js"></script></body></html>
